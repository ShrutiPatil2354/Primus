services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: primus
      POSTGRES_USER: primus
      POSTGRES_PASSWORD: primus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - primus-postgres:/var/lib/postgresql/data
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: primus
      MINIO_ROOT_PASSWORD: primus_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - primus-minio:/data
volumes:
  primus-postgres:
  primus-minio:
